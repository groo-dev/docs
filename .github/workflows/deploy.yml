name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record Release
        id: release
        uses: groo-dev/record-release@v1
        with:
          token: ${{ secrets.OPS_API_TOKEN }}
          environment: production
          bump: patch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GROO_PAT: ${{ secrets.GROO_PAT }}
          SITE_VERSION: ${{ steps.release.outputs.version }}
          GROO_AI_PROJECT_ID: ${{ vars.GROO_AI_PROJECT_ID }}
          GROO_AI_CLIENT_ID: ${{ vars.GROO_AI_CLIENT_ID }}
          GROO_ACCOUNTS_BASE_URL: ${{ vars.GROO_ACCOUNTS_BASE_URL }}
          GROO_AI_API_URL: ${{ vars.GROO_AI_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=docs
